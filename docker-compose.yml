services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=postgresql+asyncpg://ratemyalbum:ratemyalbum_secret@db:5432/ratemyalbum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=ratemyalbum
      - POSTGRES_PASSWORD=ratemyalbum_secret
      - POSTGRES_DB=ratemyalbum
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratemyalbum -d ratemyalbum"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A backend.app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://ratemyalbum:ratemyalbum_secret@db:5432/ratemyalbum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: celery -A backend.app.worker.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=postgresql+asyncpg://ratemyalbum:ratemyalbum_secret@db:5432/ratemyalbum
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production
      - ENVIRONMENT=development
    depends_on:
      - redis
      - celery-worker
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
